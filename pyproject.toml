[project]
name = "dreamcast-kos-docker"
version = "0.1.0"
description = "Build Docker images for Dreamcast development with KallistiOS."
requires-python = ">=3.11"
dependencies = [
    "click==8.3.0",
    "requests==2.32.4",
]

[project.scripts]
dcdocker = "dcdocker.cli:main"

[dependency-groups]
dev = [
    "pylint==4.0.8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcdocker"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/dcdocker",
    "/build_dc_toolchain_image.py",
    "/build_dc_kos_full_image.py",
    "/kos-alpine",
    "/tests",
    "/Makefile",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
