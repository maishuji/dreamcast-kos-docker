name: Lint and Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.11'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: make create-dev-env

      - name: Run Ruff and Pylint over package, compatibility scripts, and tests
        run: make lint

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.11'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: make create-dev-env

      - name: Test shared package and compatibility scripts
        run: make test

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.11'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: make create-dev-env
      - name: Validate wheel and sdist installations outside checkout
        run: make test-package

  dockerfile-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check supported Dockerfile
        run: docker build --check --build-arg base_image=maishuji/dc-chain:16.2.0 src/dcdocker/assets/kos-ready

      - name: Check legacy Alpine Dockerfile
        run: docker build --check --build-arg dc_chain_version=16.2.0 -f kos-alpine/Dockerfile .
